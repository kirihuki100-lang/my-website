<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jリート・ハブ</title><meta name="description" content="Jリート（不動産投資信託）とは何かをやさしく解説し、銘柄ごとの物件・LTV・分配金・借入金利を数字で見比べられる入門ガイド。"><meta property="og:title" content="Jリート・ハブ"><meta property="og:description" content="Jリートの基本と、銘柄別のポートフォリオ・財務・分配金をやさしく見比べられます。">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>:root{
  --bg:#eef1f4;--surface:#ffffff;--surface2:#f5f7f9;--ink:#0f1b2b;--ink2:#4a5868;--ink3:#77848f;
  --line:#dbe1e8;--grid:rgba(15,27,43,.08);--accent:#14507a;--accent-soft:#e2eef6;
  --head:#0f2238;--head-ink:#eaf0f7;--head-ink2:#9fb1c6;
  --pos:#17784a;--neg:#b23a30;--warn-bg:#fbf4dd;--warn-line:#eadb9c;--warn-ink:#5b4a10;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#4a3aa7;--s8:#e34948;--s9:#8a95a1;
  --t1:#2a78d6;--t2:#eb6834;--t3:#4a3aa7;--t4:#1baf7a;--t5:#eda100;--t6:#e87ba4;--t7:#9aa4af;
  --a1:#1c4a86;--a2:#4a86c8;--a3:#93b9e2;--a4:#c9dcf0;
  --shadow:0 1px 2px rgba(15,27,43,.06);
  --font:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c141d;--surface:#132030;--surface2:#0f1b29;--ink:#e8eef5;--ink2:#a9b6c4;--ink3:#7f8d9b;
  --line:#233447;--grid:rgba(232,238,245,.09);--accent:#7db8e6;--accent-soft:#17324a;
  --head:#091421;--head-ink:#eaf0f7;--head-ink2:#8ea3ba;
  --pos:#4cc58a;--neg:#f07f74;--warn-bg:#2b2610;--warn-line:#5a4d1c;--warn-ink:#e6d48a;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--s9:#8a95a1;
  --t1:#3987e5;--t2:#d95926;--t3:#9085e9;--t4:#199e70;--t5:#c98500;--t6:#d55181;--t7:#6c7986;
  --a1:#b7d4f3;--a2:#6aa5ea;--a3:#3d78b8;--a4:#24507f;
  --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#0c141d;--surface:#132030;--surface2:#0f1b29;--ink:#e8eef5;--ink2:#a9b6c4;--ink3:#7f8d9b;
  --line:#233447;--grid:rgba(232,238,245,.09);--accent:#7db8e6;--accent-soft:#17324a;
  --head:#091421;--head-ink:#eaf0f7;--head-ink2:#8ea3ba;
  --pos:#4cc58a;--neg:#f07f74;--warn-bg:#2b2610;--warn-line:#5a4d1c;--warn-ink:#e6d48a;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;--s9:#8a95a1;
  --t1:#3987e5;--t2:#d95926;--t3:#9085e9;--t4:#199e70;--t5:#c98500;--t6:#d55181;--t7:#6c7986;
  --a1:#b7d4f3;--a2:#6aa5ea;--a3:#3d78b8;--a4:#24507f;
  --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:var(--head-ink)}
.top-in{max-width:1440px;margin:0 auto;padding:10px 20px 0;display:flex;flex-wrap:wrap;gap:4px 28px;align-items:flex-end;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:12px;padding-bottom:8px}
.brand b{font-size:18px;font-weight:700;letter-spacing:.02em}
.brand span{font-size:11.5px;color:var(--head-ink2)}
.tabs{display:flex;gap:2px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{color:var(--head-ink2);text-decoration:none;padding:9px 14px;font-size:13px;font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--head-ink)}
.tabs a[aria-current="page"]{color:#fff;border-bottom-color:#5aa9e6;font-weight:700}
main{max-width:1440px;margin:0 auto;padding:20px 20px 40px}
h2.pg{font-size:20px;margin:0 0 4px;font-weight:700;text-wrap:balance}
p.lead{margin:0 0 16px;color:var(--ink2);font-size:13px;max-width:78ch}
h3.sec{font-size:14px;margin:26px 0 10px;font-weight:700;display:flex;align-items:center;gap:8px}
h3.sec small{font-weight:400;color:var(--ink3);font-size:12px}
.note{font-size:12px;color:var(--ink3)}
.banner{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);padding:9px 14px;border-radius:6px;font-size:12px;margin-bottom:16px}
/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.panel h4{margin:0 0 2px;font-size:13px;font-weight:700}
.panel .note{margin-bottom:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.cw{position:relative;height:300px}
.cw.tall{height:420px}
.cw.short{height:240px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
/* stat strip */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-bottom:16px;overflow:hidden}
.strip>div{padding:12px 16px;border-right:1px solid var(--line)}
.strip>div:last-child{border-right:0}
.strip .l{font-size:11.5px;color:var(--ink2);letter-spacing:.03em}
.strip .v{font-size:22px;font-weight:700;line-height:1.3}
.strip .v small{font-size:12px;font-weight:500;color:var(--ink2);margin-left:3px}
.strip .s{font-size:11.5px;color:var(--ink3)}
/* tables */
.tw{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tw.scroll{max-height:640px}
table.dt{width:100%;border-collapse:collapse;font-size:12.5px}
table.dt th{position:sticky;top:0;background:var(--surface2);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);color:var(--ink2);font-weight:600;font-size:11.5px;white-space:nowrap;cursor:pointer;user-select:none;z-index:2}
table.dt th.r,table.dt td.r{text-align:right}
table.dt th:hover{color:var(--accent)}
table.dt th .ar{display:inline-block;width:10px;color:var(--accent)}
table.dt td{padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
table.dt tbody tr:last-child td{border-bottom:0}
table.dt tbody tr:hover{background:var(--surface2)}
table.dt tr.click{cursor:pointer}
table.pl th{cursor:default}
table.pl th:first-child,table.pl td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;min-width:230px}
table.pl th:first-child{background:var(--surface2);z-index:3}
table.pl tr.hl td{font-weight:700;background:var(--surface2)}
table.pl tr.hl td:first-child{background:var(--surface2)}
table.pl td.ind:first-child{padding-left:26px;color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:7px}
.dot{width:10px;height:10px;border-radius:2px;flex:none;display:inline-block}
.code{font-family:var(--mono);font-size:11.5px;color:var(--ink3)}
.gain{color:var(--pos)}.loss{color:var(--neg)}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:600;color:var(--ink);background:var(--surface2);border:1px solid var(--line)}
.badge i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
/* controls */
.bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:12px}
.bar select,.bar input[type=search]{padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:12.5px;min-width:0}
.bar input[type=search]{width:min(260px,100%)}
.btn{padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;font-size:12.5px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface);cursor:pointer;font-size:12.5px}
.pill[aria-pressed="false"]{opacity:.45}
.pill[aria-pressed="true"]{border-color:var(--ink3)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-size:12.5px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.pick a{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);text-decoration:none;font-size:13px}
.pick a[aria-current="page"]{border-color:var(--ink);font-weight:700;box-shadow:inset 0 -3px 0 var(--sc,var(--accent))}
.hdr{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;align-items:flex-end;margin-bottom:12px}
/* data cards */
.dcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.dcards dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12.5px}
.dcards dt{color:var(--ink3)}
.dcards dd{margin:0;min-width:0;overflow-wrap:anywhere}
.prose{max-width:80ch;font-size:13px;color:var(--ink2)}
.prose li{margin:4px 0}
.prose code{font-family:var(--mono);font-size:12px;background:var(--surface2);padding:1px 5px;border-radius:4px}
.foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink3)}
@media(max-width:600px){main{padding:16px}.top-in{padding:10px 16px 0}.strip .v{font-size:19px}.strip>div{border-bottom:1px solid var(--line)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px 24px;margin-bottom:8px}
.hero h2{margin:0 0 8px}
.btn.cta{background:var(--accent);color:var(--surface);border-color:var(--accent);font-weight:700;text-decoration:none}
a.btn{text-decoration:none;display:inline-block;color:var(--ink)}
a.btn.cta:hover{color:var(--surface);opacity:.9}
.steps{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.steps .st{flex:1 1 150px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.steps .st b{font-size:13.5px}.steps .st span{font-size:12px;color:var(--ink2)}
.steps i{align-self:center;color:var(--ink3);font-style:normal}
@media(max-width:700px){.steps i{display:none}.steps .st{flex-basis:100%}}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.key{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.key b{font-size:14px}.key p{margin:6px 0 8px;font-size:12.5px;color:var(--ink2)}.key a{font-size:12.5px;color:var(--accent)}
.rank ol{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.rank li{display:flex;align-items:center;gap:10px;font-size:13px}
.rank .rk{width:20px;height:20px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink2);flex:none}
.rank .rv{margin-left:auto;font-weight:700}
.tp{border-bottom:1px dotted var(--ink3);cursor:help}
#tipbox{position:fixed;z-index:60;max-width:min(300px,calc(100vw - 16px));background:var(--ink);color:var(--bg);padding:8px 11px;border-radius:6px;font-size:12px;line-height:1.5;pointer-events:none;font-weight:400;text-transform:none;letter-spacing:0}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:8px}
.faq summary{cursor:pointer;font-weight:600;font-size:13.5px}
.faq p{margin:8px 0 2px;font-size:13px;color:var(--ink2);max-width:80ch}
.glossary{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px;margin:0}
.glossary>div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.glossary dt{font-weight:700;font-size:13px}.glossary dd{margin:4px 0 0;font-size:12.5px;color:var(--ink2)}

.strip.yl{border-color:var(--accent,var(--line));background:var(--surface2)}.strip.yl .v{font-size:26px}
</style></head><body><header class="top"><div class="top-in"><div class="brand"><b>Jリート・ハブ</b><span>Jリート（不動産投資信託）を、数字でやさしく比べる</span></div><nav class="tabs" id="tabs" aria-label="メニュー"></nav></div></header>

/* ---------- sortable table ---------- */
function stable(el,cols,rows,{key,dir=-1,onRow,cls=''}={}){
  let sk=key,sd=dir;
  function draw(){
    const data=[...rows].sort((a,b)=>{const av=cols.find(c=>c.k===sk).v?.(a)??a[sk],bv=cols.find(c=>c.k===sk).v?.(b)??b[sk];
      if(av==null&&bv==null)return 0;if(av==null)return 1;if(bv==null)return -1;
      return typeof av==='string'?sd*av.localeCompare(bv,'ja'):sd*(av-bv);});
    el.innerHTML=`<table class="dt ${cls}"><thead><tr>${cols.map(c=>`<th class="${c.num?'r':''}" data-k="${c.k}">${c.label}<span class="ar">${c.k===sk?(sd<0?'▼':'▲'):''}</span></th>`).join('')}</tr></thead><tbody>${data.map((r,i)=>`<tr class="${onRow?'click':''}" data-i="${rows.indexOf(r)}">${cols.map(c=>`<td class="${c.num?'r':''}">${c.r?c.r(r):(r[c.k]??'—')}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    el.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(sk===k)sd*=-1;else{sk=k;sd=cols.find(c=>c.k===k).num?-1:1;}draw();});
    if(onRow)el.querySelectorAll('tbody tr').forEach(tr=>tr.onclick=()=>onRow(rows[+tr.dataset.i]));
  }
  draw();return {redraw:draw,setRows(r){rows=r;draw();}};
}

/* time-series compare */
function seriesFor(kind){
  return D.map(r=>{
    let labs,vals,fc;
    if(kind==='ltv'){labs=r.periods;vals=r.pl.ltv;fc=r.fcst;}
    else if(kind==='dc'){labs=r.periods;vals=r.pl.dc;fc=r.fcst;}
    else if(kind==='dist'){labs=r.dist.map(d=>d.p);vals=r.dist.map(d=>d.v);fc=r.dist.map(d=>d.f);}
    else if(kind==='noi'){labs=r.detPeriods;vals=r.det.PL_NOI;fc=labs.map(()=>false);}
    else if(kind==='ni'){labs=r.periods;vals=r.pl.ni;fc=r.fcst;}
    return {r,keys:labs.map(pdate),vals,fc};
  });
}
function tsChart(id,kind,{index=false,unit='',dec=1,range,hidden=new Set()}={}){
  const S=seriesFor(kind);
  const keys=[...new Set(S.flatMap(s=>s.keys))].sort();
  const ds=S.map(s=>{
    let base=null;if(index){const i=s.vals.findIndex(v=>v!=null);base=s.vals[i];}
    const m={},f={};s.keys.forEach((k,i)=>{const v=s.vals[i];m[k]=v==null?null:(index?v/base*100:v);f[k]=s.fc[i];});
    const col=scol(s.r.id);
    return {label:s.r.short,data:keys.map(k=>m[k]??null),fcs:keys.map(k=>!!f[k]),borderColor:col,backgroundColor:col,borderWidth:2,tension:.15,spanGaps:true,hidden:hidden.has(s.r.id),
      pointRadius:c=>3.5,pointBackgroundColor:c=>c.raw!=null&&c.dataset.fcs[c.dataIndex]?cv('--surface'):col,pointBorderColor:col,pointBorderWidth:2,
      segment:{borderDash:c=>c.p1.raw!=null&&c.chart.data.datasets[c.datasetIndex].fcs[c.p1DataIndex]?[5,4]:undefined}};
  });
  const sc=scale({y:{ticks:{color:cv('--ink2'),callback:v=>fmtp(v,index?0:dec)+unit},grid:{color:cv('--grid')},border:{display:false},...(range||{})}});
  mk(id,{type:'line',data:{labels:keys,datasets:ds},options:baseOpts({scales:sc,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.raw==null?null:`${c.dataset.label}: ${fmtp(c.raw,index?1:dec)}${unit}${c.dataset.fcs[c.dataIndex]?'（予想）':''}`}}}})});
}

  <div class="pills" id="exPills" style="margin-bottom:10px">${D.map(r=>`<button class="pill" data-id="${r.id}" aria-pressed="${ex.reits.has(r.id)}"><i class="dot" style="background:${scol(r.id)}"></i>${r.short}</button>`).join('')}</div>
  <div class="bar"><select id="xType" aria-label="用途"><option value="">用途：すべて</option>${TORDER.map(t=>`<option value="${t}" ${ex.type===t?'selected':''}>${TL[t]}</option>`).join('')}</select>

  <select id="xPref" aria-label="都道府県"><option value="">都道府県：すべて</option>${prefs.map(a=>`<option ${ex.pref===a?'selected':''}>${a}</option>`).join('')}</select>

  <button class="btn" id="xCopy">表をコピー</button><span class="note" id="xCount"></span></div>

    $('#xKpi').innerHTML=`<div><div class="l">該当物件（行）</div><div class="v num">${fmt(P.length)}</div></div><div><div class="l">取得価格合計</div><div class="v num">${fmt(sum(P,p=>p.price)/100)}<small>億円</small></div></div><div><div class="l">含み損益率</div><div class="v num ${sum(A,p=>p.appr)>=pa?'gain':'loss'}">${pa?sgn((sum(A,p=>p.appr)-pa)/pa*100,1):'—'}<small>%</small></div></div><div><div class="l">1物件平均取得価格</div><div class="v num">${P.length?fmt(sum(P,p=>p.price)/P.length/100,1):'—'}<small>億円</small></div></div>`;

    mk('xPrefC',{type:'bar',data:{labels:pk,datasets:D.filter(r=>ex.reits.has(r.id)).map(r=>({label:r.short,data:pk.map(k=>sum(P.filter(p=>p.reit===r.id&&p.pref===k),p=>p.price)/100),backgroundColor:scol(r.id),borderColor:cv('--surface'),borderWidth:1.5}))},
      options:baseOpts({indexAxis:'y',plugins:{legend:{display:true,position:'bottom',labels:{color:cv('--ink2'),boxWidth:10}},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${fmt(c.raw,1)}億円`}}},scales:{x:{stacked:true,ticks:{color:cv('--ink2')},grid:{color:cv('--grid')},border:{display:false}},y:{stacked:true,reverse:true,ticks:{color:cv('--ink2')},grid:{display:false}}}})});

      options:baseOpts({interaction:{mode:'nearest',intersect:true},plugins:{legend:{display:true,position:'bottom',labels:{color:cv('--ink2'),boxWidth:10}},tooltip:{callbacks:{label:c=>`${c.raw.n}（${c.dataset.label}）築${fmt(c.raw.x,1)}年 / 含み損益率${sgnp(c.raw.y,1)}% / 取得${fmt(c.raw.price)}百万円`}}},
        scales:{x:{title:{display:true,text:'築年数（年）',color:cv('--ink2')},ticks:{color:cv('--ink2')},grid:{color:cv('--grid')},border:{display:false}},y:{title:{display:true,text:'含み損益率（%）',color:cv('--ink2')},ticks:{color:cv('--ink2')},grid:{color:cv('--grid')},border:{display:false}}}})});
    if(tbl)tbl.setRows(P);else tbl=stable($('#xTable'),propCols(true),P,{key:'price'});

  $('#xType').onchange=e=>{ex.type=e.target.value;draw();};$('#xArea').onchange=e=>{ex.area=e.target.value;draw();};$('#xPref').onchange=e=>{ex.pref=e.target.value;draw();};
  let t;$('#xQ').oninput=e=>{ex.q=e.target.value;clearTimeout(t);t=setTimeout(draw,150);};
  $('#xCopy').onclick=async()=>{const cols=propCols(true).map(c=>c);const head=['銘柄','物件名','都道府県','所在地','エリア','用途','取得価格(百万円)','鑑定評価額(百万円)','含み損益(百万円)','含み損益率(%)','賃貸可能面積(㎡)','築年数','取得時期'];
    const rows=window.__xrows.map(p=>[p.reitName,p.n,p.pref,p.ward,p.area,TL[p.t],p.price,p.appr??'',p.gain??'',p.gainPct==null?'':p.gainPct.toFixed(1),p.area_m2??'',p.age==null?'':(Math.trunc(p.age*10+1e-7)/10).toFixed(1),p.acq||'']);
    const tsv=[head,...rows].map(r=>r.join('\t')).join('\n');const b=$('#xCopy');
    try{await navigator.clipboard.writeText(tsv);b.textContent='コピーしました';}catch(e){try{const ta=document.createElement('textarea');ta.value=tsv;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();b.textContent='コピーしました';}catch(e2){b.textContent='コピーできませんでした';}}
    setTimeout(()=>b.textContent='表をコピー',1800);};
}

/* tooltip */
(function(){
  const t=document.createElement('div');t.id='tipbox';t.setAttribute('role','tooltip');t.hidden=true;document.body.appendChild(t);
  const show=el=>{t.textContent=el.dataset.tip;t.hidden=false;const r=el.getBoundingClientRect(),w=t.offsetWidth,h=t.offsetHeight;
    let x=Math.min(Math.max(8,r.left),innerWidth-w-8),y=r.top-h-8;if(y<8)y=r.bottom+8;t.style.left=x+'px';t.style.top=y+'px';};
  const hide=()=>{t.hidden=true;};
  document.addEventListener('mouseover',e=>{const el=e.target.closest?.('[data-tip]');if(el)show(el);});
  document.addEventListener('mouseout',e=>{if(e.target.closest?.('[data-tip]'))hide();});
  document.addEventListener('focusin',e=>{const el=e.target.closest?.('[data-tip]');if(el)show(el);});
  document.addEventListener('focusout',hide);
  document.addEventListener('click',e=>{const el=e.target.closest?.('[data-tip]');if(el&&!el.closest('th')){show(el);}else if(!el)hide();});
  window.addEventListener('scroll',hide,{passive:true});
})();


function vAll(){
  const FT={API:'複合',JPR:'オフィス',OJR:'複合',TRE:'複合',UUR:'複合',JBF:'オフィス',JRE:'オフィス',JMF:'複合',ADR:'住宅',MRO:'複合',MIR:'複合',NUD:'複合',DWO:'オフィス',CRR:'住宅'};
  const rows=[...D.map(r=>({code:r.code,name:r.short,id:r.id,type:FT[r.id]||'—',fiscal:r.fiscal,price:r.m.price||null,count:r.m.count,ltv:r.m.ltv,y:r.m.fyield,full:true})),
   ...LITE.map(l=>({code:l.code,name:l.short,type:l.type,fiscal:l.fiscal,price:l.price,count:l.count,ltv:l.ltv,y:l.ry,ref:true,fd:l.fdps}))];
  rows.sort((a,b)=>(b.price??-1)-(a.price??-1)||(b.full?1:0)-(a.full?1:0));
  const n=rows.length,haveP=rows.filter(r=>r.price!=null).length;
  return `<h2 class="pg">全銘柄 <span class="note">東証REIT指数構成${n}銘柄の一覧</span></h2>
  <p class="lead">全銘柄をまず一覧に反映しました。詳細ページ（物件・10期分の財務・予想利回り）を収録した銘柄は色付きの銘柄名から開けます。それ以外の銘柄は基本情報のみで、判明していない項目は「—」です。順次、詳細を追加していきます。</p>
  <div class="banner">「参考利回り」は2026年7月31日時点の株価にもとづく予想分配金利回り（ダイヤモンドZAi掲載）で、詳細収録銘柄の「予想利回り」（2026年9月18日終値・直近開示の予想2期）とは基準が異なります。取得価格・物件数・LTVは、各社IRで確認できたものだけを掲載しています（取得価格が入っている銘柄：${haveP}／${n}）。</div>
  <div class="tw scroll"><table class="dt"><thead><tr><th>銘柄</th><th>コード</th><th>用途</th><th>決算月</th><th class="r">取得価格合計（億円）</th><th class="r">物件数</th><th class="r">総資産LTV（％）</th><th class="r">予想利回り（％）</th><th>基準</th></tr></thead><tbody>${rows.map(r=>`<tr>
   <td>${r.full?`<a href="#/reit/${r.id}" style="color:inherit;font-weight:700"><span class="chip"><i class="dot" style="background:${scol(r.id)}"></i>${r.name}</span></a>`:r.name}</td>
   <td class="code">${r.code}</td><td>${r.type}</td><td>${r.fiscal||'—'}</td>
   <td class="r">${r.price!=null?fmt(r.price/100):'—'}</td><td class="r">${r.count!=null?fmt(r.count):'—'}</td><td class="r">${r.ltv!=null?fmtp(r.ltv,1):'—'}</td>
   <td class="r">${r.y!=null?fmtp(r.y,2):'—'}</td><td class="note">${r.full?'9/18終値・予想2期':'参考（7/31時点）'}</td></tr>`).join('')}</tbody></table></div>
  <p class="foot">用途・決算月・参考利回りは東証REIT指数構成銘柄の一覧記事（ダイヤモンドZAiオンライン、2026年7月31日時点）、取得価格・物件数・LTVは各投資法人のIR資料によります。</p>`;
}
/* ---------- router ---------- */
const ROUTES=[['guide','はじめに'],['overview','全体を見る'],['all','全銘柄'],['compare','比べる'],['reit','銘柄別'],['props','物件を探す'],['data','データ・出典']];
function route(){
  killCharts();
  const h=(location.hash||'#/guide').replace(/^#\/?/,'').split('/');const name=(h[0]||'guide').replace('guide-glossary','guide');
  const cur=ROUTES.some(r=>r[0]===name)?name:'guide';
  $('#tabs').innerHTML=ROUTES.map(([k,l])=>`<a href="#/${k==='reit'?'reit/'+(h[1]&&byId[h[1]]?h[1]:D[0].id):k}" ${k===cur?'aria-current="page"':''}>${l}</a>`).join('');
  const app=$('#app');
  if(cur==='guide'){app.innerHTML=vGuide();aGuide();}
  else if(cur==='overview'){app.innerHTML=vOverview();aOverview();}
  else if(cur==='all'){app.innerHTML=vAll();}
  else if(cur==='compare'){app.innerHTML=vCompare();aCompare();}
  else if(cur==='reit'){const id=byId[h[1]]?h[1]:D[0].id;app.innerHTML=vReit(id);aReit(id);}
  else if(cur==='props'){app.innerHTML=vProps();aProps();}
  else {app.innerHTML=vData();}
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',route);}catch(e){}
new MutationObserver(route).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
route();
</script></body></html>
